{% extends 'form.html' %}{% block title %}Create account{% endblock %}{% set heading='Create account' %}{% set subheading='Your bookings will be saved to your account.' %}{% block form %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><button class="button">Register</button></form>{% if verification_url %}<div class="dev-link">Development verification link: <a href="{{ verification_url }}">{{ verification_url }}</a></div>{% endif %}{% endblock %}
