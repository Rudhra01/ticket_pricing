{% extends 'form.html' %}{% block title %}Profile | Ticket Pricing{% endblock %}{% set heading='Your profile' %}{% set subheading='Update your account details securely.' %}{% block form %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Name<input name="name" value="{{ g.user['name'] }}" required></label><label>Email<input value="{{ g.user['email'] }}" disabled></label><label>New password<input name="new_password" type="password" minlength="8" placeholder="Leave blank to keep current password"></label><button class="button">Save changes</button></form>{% endblock %}
